<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'"
    />
    <title>账号池</title>
    <style>
      :root {
        --bg: #f5f6f8;
        --panel: #ffffff;
        --fg: #1f2328;
        --fg-dim: #6b7280;
        --line: #e2e5ea;
        --field: #ffffff;
        --accent: #2f6fed;
        --danger: #d94a3d;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1c1f23;
          --panel: #23272c;
          --fg: #e6e8eb;
          --fg-dim: #9aa1ab;
          --line: #33383f;
          --field: #1a1d21;
          --accent: #5b8dff;
          --danger: #f07167;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--fg);
        font: 13px/1.6 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
        display: flex;
        flex-direction: column;
      }
      header {
        padding: 12px 16px 8px;
        border-bottom: 1px solid var(--line);
      }
      header h1 {
        margin: 0 0 3px;
        font-size: 14px;
        font-weight: 600;
      }
      header p {
        margin: 0;
        font-size: 12px;
        color: var(--fg-dim);
      }
      #list {
        flex: 1;
        overflow-y: auto;
        padding: 10px 14px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 11px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: var(--panel);
        margin-bottom: 8px;
      }
      .dot {
        flex: none;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        cursor: pointer;
        border: 2px solid transparent;
      }
      .dot:hover {
        border-color: var(--fg-dim);
      }
      .name {
        flex: 1;
        min-width: 0;
        font: inherit;
        color: var(--fg);
        background: transparent;
        border: 1px solid transparent;
        border-radius: 6px;
        padding: 4px 7px;
        outline: 0;
      }
      .name:hover {
        border-color: var(--line);
      }
      .name:focus {
        border-color: var(--accent);
        background: var(--field);
      }
      .usage {
        flex: none;
        font-size: 12px;
        color: var(--fg-dim);
        min-width: 68px;
        text-align: right;
      }
      .del {
        flex: none;
        font: inherit;
        font-size: 12px;
        padding: 3px 9px;
        border-radius: 6px;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--fg-dim);
        cursor: pointer;
      }
      .del:hover {
        border-color: var(--danger);
        color: var(--danger);
      }
      .del:disabled {
        opacity: 0.35;
        cursor: not-allowed;
        border-color: var(--line);
        color: var(--fg-dim);
      }
      footer {
        padding: 10px 14px 14px;
        border-top: 1px solid var(--line);
        display: flex;
        gap: 8px;
        align-items: center;
      }
      button.primary {
        font: inherit;
        font-size: 12px;
        padding: 6px 13px;
        border-radius: 7px;
        border: 1px solid var(--accent);
        background: var(--accent);
        color: #fff;
        cursor: pointer;
      }
      button.primary:hover {
        filter: brightness(1.08);
      }
      #hint {
        font-size: 12px;
        color: var(--fg-dim);
        margin-left: auto;
      }
      details {
        margin-top: 6px;
        font-size: 12px;
        color: var(--fg-dim);
      }
      details summary {
        cursor: pointer;
        outline: 0;
      }
      details p {
        margin: 6px 0 0;
        line-height: 1.8;
      }
      code {
        background: color-mix(in srgb, var(--fg-dim) 16%, transparent);
        border-radius: 4px;
        padding: 0 4px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>账号池</h1>
      <p>每个账号是一个独立会话：cookie、localStorage、缓存互不可见，可以同时登多个号。</p>
      <details>
        <summary>窗口和账号的关系</summary>
        <p>
          每个窗口有自己的「当前账号」，窗口里新开的标签默认用它；不同窗口可以各用各的账号，互不影响。<br />
          改账号名或颜色只影响显示，不动数据；删账号会连它的 cookie 一起清掉，<code>默认</code> 不能删。
        </p>
      </details>
    </header>

    <div id="list"></div>

    <footer>
      <button id="new" class="primary">＋ 新建账号</button>
      <span id="hint"></span>
    </footer>

    <script src="accounts-ui.js"></script>
  </body>
</html>
