<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'" />
    <title>脚本仓库</title>
    <style>
      :root {
        --bg: #f5f6f8;
        --panel: #ffffff;
        --fg: #1f2328;
        --fg-dim: #6b7280;
        --line: #e2e5ea;
        --field: #ffffff;
        --accent: #2f6fed;
        --danger: #d94a3d;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1c1f23;
          --panel: #23272c;
          --fg: #e6e8eb;
          --fg-dim: #9aa1ab;
          --line: #33383f;
          --field: #1a1d21;
          --accent: #5b8dff;
          --danger: #f07167;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--fg);
        font: 13px/1.5 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        border-bottom: 1px solid var(--line);
      }
      header h1 {
        font-size: 14px;
        font-weight: 600;
        margin: 0;
        flex: 1;
      }
      button {
        font: inherit;
        font-size: 12px;
        padding: 5px 11px;
        border-radius: 6px;
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--fg);
        cursor: pointer;
      }
      button:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      button.primary:hover {
        filter: brightness(1.08);
        color: #fff;
      }
      button.danger:hover {
        border-color: var(--danger);
        color: var(--danger);
      }
      main {
        flex: 1;
        display: flex;
        min-height: 0;
      }
      #list {
        width: 260px;
        flex: none;
        border-right: 1px solid var(--line);
        overflow-y: auto;
        padding: 6px;
      }
      .item {
        padding: 8px 10px;
        border-radius: 7px;
        cursor: pointer;
        display: flex;
        gap: 8px;
        align-items: flex-start;
      }
      .item:hover {
        background: color-mix(in srgb, var(--fg-dim) 12%, transparent);
      }
      .item.active {
        background: color-mix(in srgb, var(--accent) 16%, transparent);
      }
      .item .name {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-weight: 500;
      }
      .item .pat {
        font-size: 11px;
        color: var(--fg-dim);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .item.off .name,
      .item.off .pat {
        opacity: 0.45;
      }
      .dot {
        flex: none;
        width: 7px;
        height: 7px;
        margin-top: 6px;
        border-radius: 50%;
        background: #2fa36b;
      }
      .item.off .dot {
        background: var(--fg-dim);
      }
      #editor {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        padding: 12px 14px;
        gap: 8px;
        overflow: hidden;
      }
      label {
        font-size: 12px;
        color: var(--fg-dim);
      }
      .row {
        display: flex;
        gap: 10px;
      }
      .row > div {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      input,
      textarea {
        font: inherit;
        color: var(--fg);
        background: var(--field);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 6px 9px;
        outline: 0;
      }
      input:focus,
      textarea:focus {
        border-color: var(--accent);
      }
      textarea {
        resize: none;
        font-family: "Cascadia Mono", "Consolas", ui-monospace, monospace;
        font-size: 12px;
        line-height: 1.55;
      }
      #code {
        flex: 1;
        min-height: 120px;
      }
      #matches {
        height: 58px;
      }
      footer {
        display: flex;
        gap: 8px;
        align-items: center;
        padding-top: 4px;
      }
      footer .spacer {
        flex: 1;
      }
      #hint {
        color: var(--fg-dim);
        font-size: 12px;
      }
      .empty {
        color: var(--fg-dim);
        padding: 18px 12px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>脚本仓库</h1>
      <button id="refresh">重载已开页面</button>
      <button id="new" class="primary">新建脚本</button>
    </header>
    <main>
      <div id="list"></div>
      <div id="editor">
        <div class="row">
          <div>
            <label for="name">名称</label>
            <input id="name" placeholder="例如：去掉知乎登录墙" />
          </div>
          <div>
            <label for="enabledRow">&nbsp;</label>
            <label id="enabledRow" style="display: flex; gap: 6px; align-items: center; color: var(--fg)">
              <input id="enabled" type="checkbox" checked style="width: auto" /> 启用
            </label>
          </div>
        </div>
        <label for="matches">匹配规则（每行一条，* 通配）</label>
        <textarea id="matches" spellcheck="false">*://*/*</textarea>
        <label for="code">代码（页面加载完成后执行，作用域是页面本身）</label>
        <textarea id="code" spellcheck="false" placeholder="document.body.style.background = '#fff';"></textarea>
        <footer>
          <span id="hint"></span>
          <span class="spacer"></span>
          <button id="delete" class="danger">删除</button>
          <button id="save" class="primary">保存</button>
        </footer>
      </div>
    </main>
    <script src="scripts-ui.js"></script>
  </body>
</html>
